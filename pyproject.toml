[project]
name = "pareto-iqa-quickstart"
version = "0.1.0"
description = "Quick start for the summer-school project on Pareto-optimal IQA for CLIP-based architectures"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers>=4.37",
    "pandas",
    "openpyxl",  # SPAQ ships its labels as xlsx
    "numpy",
    "scipy",
    "pillow",
]

# The scripts sit at the repo root rather than in a package, and setuptools
# refuses to guess which of them to install. Naming them keeps `pip install -e .`
# working and makes them importable from anywhere.
[tool.setuptools]
py-modules = ["benchmark", "dataset", "download_data", "prepare_data", "train"]
